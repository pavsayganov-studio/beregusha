name: Build macOS 10.10 Legacy Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Обязательно нужны права для создания релизов
permissions:
  contents: write

jobs:
  build-legacy:
    runs-on: macos-13

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go 1.20
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Clone and Build sing-box core
      run: |
        git clone -b v1.4.5 https://github.com/SagerNet/sing-box.git core-build
        cd core-build
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../macos-legacy/sing-box ./cmd/sing-box

    - name: Compile Swift App
      run: |
        cd macos-legacy
        APP_NAME="HiddifyLegacy"
        APP_BUNDLE="$APP_NAME.app"
        
        mkdir -p "$APP_BUNDLE/Contents/MacOS"
        mkdir -p "$APP_BUNDLE/Contents/Resources"
        
        cp Info.plist "$APP_BUNDLE/Contents/Info.plist"
        cp sing-box "$APP_BUNDLE/Contents/Resources/sing-box"
        chmod +x "$APP_BUNDLE/Contents/Resources/sing-box"
        
        swiftc main.swift AppDelegate.swift ViewController.swift \
          -o "$APP_BUNDLE/Contents/MacOS/$APP_NAME" \
          -target x86_64-apple-macosx10.10
          
        zip -r ../Hiddify-macOS-10.10-Legacy.zip "$APP_BUNDLE"

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "legacy-latest"
        name: "macOS 10.10 Legacy Build"
        body: "Автоматическая сборка минималистичного клиента для MacBook Air 2011 (macOS 10.10+)."
        files: Hiddify-macOS-10.10-Legacy.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
